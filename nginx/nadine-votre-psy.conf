#
# Server configuration
#
server {
  server_name nadine-votre-psy.fr www.nadine-votre-psy.fr;

  root /var/www/nadine-votre-psy;
	index index.html;

	error_page 404 /404.html;

	location / {
    try_files $uri $uri.html $uri/ =404;
	}

	listen [::]:443 ssl; # managed by Certbot
	listen 443 ssl; # managed by Certbot
	
	ssl_certificate /etc/letsencrypt/live/nadine-votre-psy.fr/fullchain.pem; # managed by Certbot
	ssl_certificate_key /etc/letsencrypt/live/nadine-votre-psy.fr/privkey.pem; # managed by Certbot
	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
	if ($host = www.nadine-votre-psy.fr) {
			return 301 https://$host$request_uri;
	} # managed by Certbot


	if ($host = nadine-votre-psy.fr) {
			return 301 https://$host$request_uri;
	} # managed by Certbot

	listen 80;
	listen [::]:80;
  server_name nadine-votre-psy.fr www.nadine-votre-psy.fr;
	return 404; # managed by Certbot
}