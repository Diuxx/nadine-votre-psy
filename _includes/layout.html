<!Doctype html>
<html lang="fr">
  <head>
      <meta charset="UTF-8">

      <!-- Responsive layout for mobile and tablet devices -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <!-- SEO title: shown in search results and browser tab -->
      <title>{% if title %}{{ title }} | {{ meta.default.title }}{% else %}{{ meta.default.title }}{% endif %}</title>
      
      <!-- SEO description: summary displayed in search engine results -->
      <meta name="description" content="{% if description %}{{ description }}{% else %}{{ meta.default.description }}{% endif %}">
      
      <!-- Canonical URL: prevents duplicate content issues -->
      <link rel="canonical" href="{{ meta.default.siteUrl }}{{ page.url }}">

      <!-- Search engine indexing rules -->
      <meta name="robots" content="index, follow">
      <meta name="googlebot" content="index, follow">

      <!-- Website author (credibility signal) -->
      <meta name="author" content="{{ meta.default.author }}">

      <!-- Open Graph: preview when sharing on social platforms -->
      <meta property="og:type" content="website">
      <meta property="og:locale" content="fr_FR">
      <meta property="og:site_name" content="{{ meta.default.title }}">
      <meta property="og:title" content="{% if title %}{{ title }}{% else %}{{ meta.default.title }}{% endif %}">
      <meta property="og:description" content="{% if description %}{{ description }}{% else %}{{ meta.default.description }}{% endif %}">
      <meta property="og:url" content="{{ meta.default.siteUrl }}{{ page.url }}">
      <meta property="og:image" content="{{ meta.default.siteUrl }}/src/assets/images/nadine-small.jpg">

      <!-- Twitter Card: optimized preview for Twitter/X -->
      <meta name="twitter:card" content="summary_large_image">
      <meta name="twitter:title" content="{% if title %}{{ title }}{% else %}{{ meta.default.title }}{% endif %}">
      <meta name="twitter:description" content="{% if description %}{{ description }}{% else %}{{ meta.default.description }}{% endif %}">
      <meta name="twitter:image" content="{{ meta.default.siteUrl }}/src/assets/images/nadine-small.jpg">
      
      <!-- Browser tab icon -->
      <link rel="icon" href="{{ '/src/assets/favicon.webp' | url }}" type="image/x-icon">

      <!-- Main stylesheet -->
      <link rel="stylesheet" href="{{ '/src/styles/main.css' | url }}">
      <link rel="stylesheet" href="{{ '/src/styles/contact-form.css' | url }}">
  </head>
  <body>
    <!-- Site header -->
    {% include 'header.html' %}
    <!-- Page content -->
    {{ content }}
    <!-- Site footer -->
    {% include 'footer.html' %}
    <script src="{{ '/src/scripts/menu.js' | url }}" defer></script>
    <script src="{{ '/src/scripts/form.js' | url }}" defer></script>
  </body>
</html>
